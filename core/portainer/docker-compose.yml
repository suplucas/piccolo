services:
  portainer:
    container_name: portainer
    image: portainer/portainer-ce:lts
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    ports:
      - 9443:9443
      - 8000:8000
    networks:
      - proxy_net
      - portainer_network

networks:
  proxy_net:
    external: true
  portainer_network:
    name: portainer_network

volumes:
  portainer_data:
    name: portainer_data
