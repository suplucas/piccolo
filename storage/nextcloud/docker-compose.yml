services:
  nextcloud-db:
    image: postgres:16-alpine
    container_name: nextcloud-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - /homelab/storage/nextcloud/db:/var/lib/postgresql/data
    networks:
      - proxy_net
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G

  nextcloud-redis:
    image: redis:alpine
    container_name: nextcloud-redis
    restart: unless-stopped
    networks:
      - proxy_net
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  nextcloud:
    image: nextcloud:apache
    container_name: nextcloud
    restart: unless-stopped
    environment:
      - POSTGRES_HOST=nextcloud-db
      - POSTGRES_DB=nextcloud
      - POSTGRES_USER=nextcloud
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - REDIS_HOST=nextcloud-redis
      # Reverse proxy (Caddy + Cloudflare Tunnel)
      - NEXTCLOUD_TRUSTED_DOMAINS=cloud.piccollo.stream
      - OVERWRITEHOST=cloud.piccollo.stream
      - OVERWRITEPROTOCOL=https
      - OVERWRITECLIURL=https://cloud.piccollo.stream
      - TRUSTED_PROXIES=172.16.0.0/12,10.0.0.0/8,192.168.0.0/16
      # Usados apenas na primeira inicialização
      - NEXTCLOUD_ADMIN_USER=${NEXTCLOUD_ADMIN_USER}
      - NEXTCLOUD_ADMIN_PASSWORD=${NEXTCLOUD_ADMIN_PASSWORD}
      - NEXTCLOUD_ADMIN_EMAIL=${NEXTCLOUD_ADMIN_EMAIL}
    volumes:
      - /homelab/storage/nextcloud/data:/var/www/html
    networks:
      - proxy_net
    depends_on:
      - nextcloud-db
      - nextcloud-redis
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 2G

networks:
  proxy_net:
    external: true
