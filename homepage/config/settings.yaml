# =============================================================================
# Homepage > settings.yaml
# Visual, layout e comportamento do painel.
# Apos salvar, clique no icone de refresh (canto inferior direito) para recarregar.
# =============================================================================

title: Piccolo Homelab
description: Infraestrutura pessoal - painel central

# Visual -------------------------------------------------------------------
theme: dark            # dark | light
color: slate           # slate gray zinc neutral stone amber yellow lime green
                       # emerald teal cyan sky blue indigo violet purple fuchsia
                       # pink rose red white
headerStyle: clean     # underlined (padrao) | boxed | clean | boxedWidgets
showStats: true        # expande CPU/RAM/rede ao clicar no status do container

# Ordem e disposicao dos grupos (os nomes precisam bater com services.yaml)
layout:
  - Infraestrutura:
      style: row
      columns: 4
  - Downloads:
      style: row
      columns: 4
  - Mídia:
      style: row
      columns: 4
