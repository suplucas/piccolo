# =============================================================================
# Homepage > services.yaml
#
# DOIS enderecos em cada servico:
#   href      -> usado pelo SEU navegador  (host:porta do host, ex: piccolo:8096)
#   widget.url-> usado pelo container do Homepage dentro da rede Docker
#                (nome do servico:PORTA DO CONTAINER, ex: qbittorrent:8080)
#
# server/container -> integra com o docker.yaml (status ligado/desligado).
#
# SUBSTITUA os valores COLE_AQUI_* pelos chaves reais:
#   ./scripts/05-fetch-api-keys.sh   (preenche automaticamente Radarr/Sonarr/Prowlarr)
# =============================================================================

- Infraestrutura:
    - Portainer:
        icon: portainer.png
        href: http://piccolo:9000
        description: Gestao de containers e stacks
        server: my-docker
        container: portainer
        widget:
          type: portainer
          url: http://portainer:9000
          env: 1
          key: COLE_AQUI_PORTAINER_API_KEY

    - Nginx Proxy Manager:
        icon: nginx-proxy-manager.png
        href: http://piccolo:81
        description: Proxy reverso e certificados SSL
        server: my-docker
        container: nginx-proxy-manager
        widget:
          type: npm
          url: http://nginx-proxy-manager:81
          username: COLE_AQUI_NPM_USUARIO_VIEW_ONLY
          password: COLE_AQUI_NPM_SENHA

    - Dozzle:
        icon: dozzle.png
        href: http://piccolo:8888
        description: Logs em tempo real de todos os containers
        server: my-docker
        container: dozzle

    - Homepage:
        icon: homepage.png
        href: http://piccolo:8080
        description: Este painel
        server: my-docker
        container: homepage

    - Coolify:
        icon: coolify.png
        href: http://piccolo:8000
        description: Deploy de aplicacoes
        server: my-docker
        container: coolify

    - Cloudflared:
        icon: cloudflared.png
        href: http://piccolo:14333
        description: Tunel Cloudflare (acesso externo)
        server: my-docker
        container: cloudflared

- Downloads:
    - qBittorrent:
        icon: qbittorrent.png
        href: http://piccolo:8081
        description: Cliente de torrents
        server: my-docker
        container: qbittorrent
        widget:
          type: qbittorrent
          url: http://qbittorrent:8080
          username: COLE_AQUI_QBIT_USUARIO
          password: COLE_AQUI_QBIT_SENHA

    - Radarr:
        icon: radarr.png
        href: http://piccolo:7878
        description: Automacao de filmes
        server: my-docker
        container: radarr
        widget:
          type: radarr
          url: http://radarr:7878
          key: COLE_AQUI_RADARR_API_KEY

    - Sonarr:
        icon: sonarr.png
        href: http://piccolo:8989
        description: Automacao de series
        server: my-docker
        container: sonarr
        widget:
          type: sonarr
          url: http://sonarr:8989
          key: COLE_AQUI_SONARR_API_KEY

    - Prowlarr:
        icon: prowlarr.png
        href: http://piccolo:9696
        description: Indexadores
        server: my-docker
        container: prowlarr
        widget:
          type: prowlarr
          url: http://prowlarr:9696
          key: COLE_AQUI_PROWLARR_API_KEY

- Mídia:
    - Jellyfin:
        icon: jellyfin.png
        href: http://piccolo:8096
        description: Filmes, series e musica
        server: my-docker
        container: jellyfin
        widget:
          type: jellyfin
          url: http://jellyfin:8096
          key: COLE_AQUI_JELLYFIN_API_KEY
          version: 2
          enableBlocks: true

    - Jellyseerr:
        icon: jellyseerr.png
        href: http://piccolo:8196
        description: Pedidos de midia
        server: my-docker
        container: jellyseerr
        widget:
          type: seerr
          url: http://jellyseerr:5055
          key: COLE_AQUI_SEERR_API_KEY

    - Immich:
        icon: immich.png
        href: http://piccolo:2283
        description: Fotos e videos do celular
        server: my-docker
        container: immich-server
        widget:
          type: immich
          url: http://immich-server:2283
          key: COLE_AQUI_IMMICH_API_KEY
          version: 2

    - SteamOS:
        icon: steam.png
        href: http://piccolo:3000
        description: Steam / jogos
        server: my-docker
        container: steamos
