services:
  seerr:
    container_name: seerr
    image: seerr/seerr:latest
    restart: unless-stopped
    environment:
      - LOG_LEVEL=info
      - TZ=America/Sao_Paulo
      - PORT=5055
    volumes:
      - ./config:/app/config
    networks:
      - proxy_net

networks:
  proxy_net:
    external: true
